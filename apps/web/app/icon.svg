<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Toran">
  <title>Toran</title>
  <!--
    The Sanchi Stupa Toran: two posts carrying three architraves. It is the
    main facade of the Dr. Ambedkar National Memorial, and the mark here.
  -->
  <g fill="none" stroke="#91642c" stroke-width="2.1" stroke-linecap="square">
    <!-- posts -->
    <path d="M9 29V9" />
    <path d="M23 29V9" />
    <!-- three architraves, the lowest widest -->
    <path d="M5 21h22" />
    <path d="M6 15h20" />
    <path d="M7 9h18" />
  </g>
  <!-- crowning finial -->
  <circle cx="16" cy="4.5" r="2.1" fill="#91642c" />
</svg>
